name: Build and deploy personal Azure site

on:
  push:
    branches: [personal]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the dedicated DeepStruggle Static Web App (personal only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: personal-azure-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMSDK_VERSION: "6.0.10"
      TS_PYTHON: python3
      TS_WEB_BASE: /
      TS_STATS_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.local/opt/emsdk
          key: personal-azure-emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install the WebAssembly compiler
        run: bash tools/scripts/install_emsdk.sh
      - name: Restore verified artwork cache
        uses: actions/cache@v4
        with:
          path: web/ui/public/personal
          key: personal-artwork-v1-${{ hashFiles('web/ui/src/board/counter-sources.json', 'web/ui/src/effects/steam-icons.json', 'web/ui/src/space/steam-track.json', 'web/ui/src/cards/hanon-art.json', 'web/ui/src/artwork/english-sources.json', 'deploy/azure/prepare-*') }}
      - name: Prepare and verify artwork
        # Recheck hashes on cache hits too. Never publish missing or mismatched art.
        # GitHub release downloads can transiently return 504; space retries apart.
        shell: bash
        run: |
          set -euo pipefail
          retry_artwork() {
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              if [ "$attempt" -eq 4 ]; then return 1; fi
              delay=$((attempt * 15))
              echo "::warning::Artwork preparation failed (attempt $attempt/4); retrying in ${delay}s."
              sleep "$delay"
            done
          }
          retry_artwork node deploy/azure/prepare-artwork.mjs
          retry_artwork python3 deploy/azure/prepare-effects.py
          retry_artwork python3 deploy/azure/prepare-space.py
          retry_artwork python3 deploy/azure/prepare-cards.py
          retry_artwork python3 deploy/azure/prepare-english-artwork.py
      - name: Build the engine and website
        run: bash tools/scripts/build_web.sh
      - name: Prepare Azure configuration
        run: cp deploy/azure/staticwebapp.config.json web/ui/dist/staticwebapp.config.json
      - name: Smoke test the packaged engine and check site size
        shell: bash
        run: |
          set -euo pipefail
          node tests/web/wasm_parity.mjs web/ui/dist/engine/ts_engine.mjs selftest 10 > "$RUNNER_TEMP/wasm-selftest.json"
          python3 - "$RUNNER_TEMP/wasm-selftest.json" <<'PY'
          import json
          import hashlib
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("steps", 0) <= 0 or result.get("fingerprint") in (None, "", "unknown"):
              raise SystemExit(f"Engine smoke test failed: {result}")
          root = pathlib.Path("web/ui/dist")
          for name in ("index.html", "engine/ts_engine.mjs", "engine/ts_engine.wasm", "staticwebapp.config.json", "personal/hanon-board.jpg"):
              if not (root / name).is_file() or (root / name).stat().st_size == 0:
                  raise SystemExit(f"Missing or empty deployment file: {name}")
          manifest = json.loads(pathlib.Path("web/ui/src/board/counter-sources.json").read_text())
          for counter in manifest["assets"]:
              if not (root / "personal" / "counters" / f"{counter}.png").is_file():
                  raise SystemExit(f"Missing counter artwork: {counter}")
          files = [p for p in root.rglob("*") if p.is_file()]
          effects = json.loads(pathlib.Path("web/ui/src/effects/steam-icons.json").read_text())
          for name, asset in effects["assets"].items():
              icon = root / "personal" / "effects" / f"{name}.png"
              if not icon.is_file() or hashlib.sha256(icon.read_bytes()).hexdigest() != asset["sha256"]:
                  raise SystemExit(f"Missing or corrupt effect icon: {name}")
          stages = json.loads(pathlib.Path("web/ui/src/space/steam-track.json").read_text())["stages"]
          for stage in stages.values():
              icon = root / "personal" / "space" / f"{stage['name']}.png"
              if not icon.is_file() or hashlib.sha256(icon.read_bytes()).hexdigest() != stage["sha256"]:
                  raise SystemExit(f"Missing or corrupt space artwork: {stage['name']}")
          font = root / "fonts/source-han-serif/SourceHanSerifCN-VF.otf.woff2"
          cards = json.loads(pathlib.Path("web/ui/src/cards/hanon-art.json").read_text())["cards"]
          if set(cards) != {str(i) for i in range(1, 111)}:
              raise SystemExit("Incomplete card artwork manifest")
          for card_id, asset in cards.items():
              face = root / "personal" / "cards" / asset["file"]
              if not face.is_file() or hashlib.sha256(face.read_bytes()).hexdigest() != asset["sha256"]:
                  raise SystemExit(f"Missing or corrupt card artwork: {card_id}")
          if not font.is_file() or hashlib.sha256(font.read_bytes()).hexdigest() != "808cb3203bb9cdd6b166a8a656a0c7608a7dc2a31c41c2cd0374550cae445471":
              raise SystemExit("Missing or corrupt Source Han Serif font")
          english = json.loads(pathlib.Path("web/ui/src/artwork/english-sources.json").read_text())
          if set(english["cards"]) != {str(i) for i in range(1, 111)}:
              raise SystemExit("Incomplete English card artwork manifest")
          for asset in [english["board"], *english["counters"].values(), *english["cards"].values()]:
              image = root / "personal" / asset["file"]
              if not image.is_file() or hashlib.sha256(image.read_bytes()).hexdigest() != asset["sha256"]:
                  raise SystemExit(f"Missing or corrupt English artwork: {asset['file']}")
          if not (root / "fonts/source-han-serif/LICENSE.txt").is_file():
              raise SystemExit("Missing font license")
          size = sum(p.stat().st_size for p in files)
          print(f"Engine smoke test: {result}")
          print(f"Site: {len(files)} files, {size / 1_000_000:.1f} MB")
          if size > 250_000_000 or len(files) > 15_000:
              raise SystemExit("Site exceeds the Azure Static Web Apps Free environment budget.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepstruggle-static-site
          path: web/ui/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ github.ref == 'refs/heads/personal' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true')) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure-static-web-apps
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepstruggle-static-site
          path: site
      - name: Check dedicated site token
        env:
          AZURE_SITE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_SITE_TOKEN" ]; then
            echo "::error::Set AZURE_STATIC_WEB_APPS_API_TOKEN for the dedicated DeepStruggle site. Do not use the PCOL site token."
            exit 1
          fi
      - name: Upload the prebuilt website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: personal
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
